apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels: { app: demo-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: demo-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: demo-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: demo-api
          image: ghcr.io/mo2mengoda/demo-api:1.0.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: ERROR_RATE, value: "0.01" }
            - { name: LATENCY_MS, value: "80" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo
  labels: { app: demo-api }
spec:
  selector: { app: demo-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Tells the Prometheus Operator to scrape demo-api every 15s
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  namespace: demo
spec:
  selector:
    matchLabels: { app: demo-api }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
